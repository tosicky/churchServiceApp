version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: church-timer-backend
    ports:
      - "8000:8000"
    environment:
      - PROPRESENTER_ENABLED=true
      # - PROPRESENTER_HOST=host.docker.internal
      - PROPRESENTER_HOST=192.168.2.37
      - PROPRESENTER_PORT=61767
      - PROPRESENTER_TIMER_NAME=Segment Countdown
      # IANA timezone for the "weekly" recurring service-start countdown (the one-time mode
      # doesn't need this - it's computed from the operator's own browser). Only matters if
      # you use weekly recurrence. Override without editing this file: either drop a .env
      # file next to this one with TZ=America/Moncton (docker compose loads it automatically),
      # or run `TZ=America/Moncton docker compose up -d`.
      - TZ=${TZ:-UTC}
    volumes:
      - ./backend/data:/app/data
    networks:
      - church-timer-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/timer/state"]
      interval: 30s
      timeout: 15s
      retries: 2
      start_period: 45s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: church-timer-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - church-timer-network
    restart: unless-stopped

networks:
  church-timer-network:
    driver: bridge
